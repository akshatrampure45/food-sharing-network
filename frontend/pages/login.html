<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login — FoodShare</title>
  <link rel="stylesheet" href="../css/style.css?v=5">
</head>
<body>
  <nav class="site-nav">
    <div class="nav-inner">
      <a class="brand" href="../index.html">FoodShare</a>
      <div class="nav-links">
        <a class="btn btn-outline btn-sm nav-protected" href="browse.html" hidden>Browse Nearby</a>
        <a class="btn btn-outline btn-sm nav-protected" href="donate.html" hidden>Donate Food</a>
        <div id="auth-area"></div>
      </div>
    </div>
  </nav>

  <div class="auth-split">
    <div class="auth-photo">
      <div class="auth-photo-caption">
        <span class="eyebrow">Hyperlocal &middot; Verified Fresh</span>
        <h2>A meal shared is a smile shared.</h2>
      </div>
    </div>
    <div class="auth-form-side">
      <div class="auth-inner">
        <h2 class="form-title">Welcome back</h2>
        <p class="subtext">Log in to donate or claim food nearby.</p>
        <form onsubmit="handleLogin(event)">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" required>
          </div>
          <p id="error-msg" class="status-msg err"></p>
          <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>
        <p class="auth-switch">New here? <a href="signup.html">Create an account</a></p>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js?v=2"></script>
  <script src="../js/nav.js?v=3"></script>
  <script>initNavAuth("login.html", "../index.html");</script>
</body>
</html>
